
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Human Character</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #11131c;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#scene {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

#character {
    position: absolute;
    width: 180px;
    height: 350px;
    bottom: 0;
    left: 0;
    will-change: transform;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#status {
    position: absolute;
    top: 20px;
    left: 15px;
    right: 15px;
    z-index: 10;
    padding: 14px;
    background: #252b3b;
    color: white;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
}
</style>

<!-- IMPORTANT: Three.js import map -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
}
</script>

</head>

<body>

<div id="scene">

    <div id="status">
        Connecting to 3D engine...
    </div>

    <div id="character">
        <canvas id="human"></canvas>
    </div>

</div>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";


/* ==========================
   ELEMENTS
========================== */

const canvas = document.getElementById("human");

const characterBox = document.getElementById("character");

const status = document.getElementById("status");


/* ==========================
   SCENE
========================== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    35,
    180 / 350,
    0.1,
    100
);

camera.position.set(0, 1.1, 4);

camera.lookAt(0, 0.9, 0);


/* ==========================
   RENDERER
========================== */

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.setSize(180, 350, false);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.2;


/* ==========================
   LIGHTING
========================== */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x555566,
    2
);

scene.add(ambient);

const mainLight = new THREE.DirectionalLight(
    0xffffff,
    3
);

mainLight.position.set(2, 4, 5);

scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(
    0x9ebaff,
    1
);

fillLight.position.set(-3, 2, -2);

scene.add(fillLight);


/* ==========================
   MODEL VARIABLES
========================== */

let human = null;

let mixer = null;

let clips = [];

const clock = new THREE.Clock();


/* ==========================
   LOAD HUMAN MODEL
========================== */

const loader = new GLTFLoader();

status.textContent = "Loading man.glb...";

loader.load(

    "./man.glb",

    function(gltf) {

        human = gltf.scene;

        scene.add(human);

        // Calculate model size

        const box = new THREE.Box3()
            .setFromObject(human);

        const size = box.getSize(
            new THREE.Vector3()
        );

        // Fit model into the screen

        if (size.y > 0) {

            const scale = 1.7 / size.y;

            human.scale.setScalar(scale);

            human.position.y = -box.min.y * scale;

        }

        // Check animations

        clips = gltf.animations;

        let result = "";

        if (clips.length > 0) {

            mixer = new THREE.AnimationMixer(human);

            const names = clips.map(
                clip => clip.name
            );

            result =
                "\nAnimations found: " +
                clips.length +
                "\nNames: " +
                names.join(", ");

            console.log("Animations:", names);

            // Play walk animation if available

            const walk = clips.find(
                clip => /walk/i.test(clip.name)
            );

            const idle = clips.find(
                clip => /idle/i.test(clip.name)
            );

            if (walk) {

                mixer.clipAction(walk).play();

            } else if (idle) {

                mixer.clipAction(idle).play();

            }

        } else {

            result =
                "\nNo animations found in this model.";

        }

        status.textContent =
            "3D HUMAN LOADED SUCCESSFULLY!" + result;

        console.log("Model loaded:", gltf);

    },

    function(progress) {

        if (progress.total > 0) {

            const percentage = Math.round(
                progress.loaded / progress.total * 100
            );

            status.textContent =
                "Loading 3D human: " +
                percentage + "%";

        } else {

            status.textContent =
                "Downloading 3D human...";

        }

    },

    function(error) {

        console.error("GLB ERROR:", error);

        status.textContent =
            "MODEL LOADING FAILED!\n\n" +
            "Check these:\n" +
            "1. Is man.glb in the repository root?\n" +
            "2. Is the filename exactly man.glb?\n" +
            "3. Is your internet connected?\n" +
            "4. Is the GLB file valid?";

    }

);


/* ==========================
   LEFT TO RIGHT MOVEMENT
========================== */

let position = -180;

let direction = 1;

const speed = 100;


/* ==========================
   MAIN ANIMATION
========================== */

function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(
        clock.getDelta(),
        0.05
    );

    // Move character

    const screenWidth = window.innerWidth;

    const characterWidth =
        characterBox.offsetWidth;

    position += direction * speed * delta;

    // Right edge

    if (position >= screenWidth - characterWidth) {

        position = screenWidth - characterWidth;

        direction = -1;

    }

    // Left edge

    if (position <= 0) {

        position = 0;

        direction = 1;

    }

    // Character direction

    characterBox.style.transform =
        `translateX(${position}px) scaleX(${direction < 0 ? -1 : 1})`;

    // Update 3D animation

    if (mixer) {

        mixer.update(delta);

    }

    renderer.render(scene, camera);

}

animate();


/* ==========================
   SCREEN RESIZE
========================== */

window.addEventListener("resize", function() {

    renderer.setSize(180, 350, false);

});

</script>

</body>
</html>
