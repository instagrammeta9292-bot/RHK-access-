
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Walking Human</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #11131c;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#scene {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

#character {
    position: absolute;
    width: 180px;
    height: 350px;
    bottom: 0;
    left: 0;
    will-change: transform;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#status {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    background: #252b3b;
    color: white;
    padding: 12px;
    border-radius: 12px;
    z-index: 10;
    font-size: 13px;
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
}
</script>

</head>

<body>

<div id="scene">

    <div id="status">Loading human...</div>

    <div id="character">
        <canvas id="human"></canvas>
    </div>

</div>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";


/* ==========================
   BASIC SETTINGS
========================== */

const canvas = document.getElementById("human");

const characterBox = document.getElementById("character");

const status = document.getElementById("status");


/* ==========================
   THREE JS SCENE
========================== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    35,
    180 / 350,
    0.1,
    100
);

camera.position.set(0, 1.1, 4);

camera.lookAt(0, 0.9, 0);


/* ==========================
   RENDERER
========================== */

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.setSize(180, 350, false);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.2;


/* ==========================
   LIGHTING
========================== */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x555566,
        2
    )
);

const light = new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(2, 4, 5);

scene.add(light);


/* ==========================
   MODEL VARIABLES
========================== */

let human = null;

let mixer = null;

let walkAction = null;

let runAction = null;

const clock = new THREE.Clock();


/* ==========================
   LOAD HUMAN
========================== */

const loader = new GLTFLoader();

loader.load(

    "./man.glb",

    function(gltf) {

        human = gltf.scene;

        scene.add(human);


        // Model size

        const box = new THREE.Box3()
            .setFromObject(human);

        const size = box.getSize(
            new THREE.Vector3()
        );

        const scale = 1.7 / size.y;

        human.scale.setScalar(scale);

        human.position.y = -box.min.y * scale;


        // Load animations

        mixer = new THREE.AnimationMixer(human);

        const walkClip = gltf.animations.find(
            clip => /walk/i.test(clip.name)
        );

        const runClip = gltf.animations.find(
            clip => /run/i.test(clip.name)
        );


        if (walkClip) {

            walkAction = mixer.clipAction(walkClip);

            walkAction.setLoop(THREE.LoopRepeat);

            walkAction.play();

        }

        if (runClip) {

            runAction = mixer.clipAction(runClip);

            runAction.setLoop(THREE.LoopRepeat);

        }


        status.textContent =
            "3D HUMAN READY!\n" +
            "Walk: " + (walkClip ? "Available" : "Missing") +
            "\nRun: " + (runClip ? "Available" : "Missing");


        console.log("Animations:", gltf.animations);

    },

    function(progress) {

        if (progress.total > 0) {

            status.textContent =
                "Loading: " +
                Math.round(
                    progress.loaded / progress.total * 100
                ) + "%";

        }

    },

    function(error) {

        console.error(error);

        status.textContent = "Model loading failed!";

    }

);


/* ==========================
   MOVEMENT
========================== */

let position = -180;

let direction = 1;

const speed = 90;


/* ==========================
   MAIN ANIMATION
========================== */

function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(
        clock.getDelta(),
        0.05
    );


    // Move from left to right

    const screenWidth = window.innerWidth;

    const characterWidth =
        characterBox.offsetWidth;

    position += direction * speed * delta;


    // Turn at right side

    if (position >= screenWidth - characterWidth) {

        position = screenWidth - characterWidth;

        direction = -1;

    }


    // Turn at left side

    if (position <= 0) {

        position = 0;

        direction = 1;

    }


    // Face walking direction

    characterBox.style.transform =
        `translateX(${position}px) scaleX(${direction < 0 ? -1 : 1})`;


    // Play walking animation

    if (mixer) {

        mixer.update(delta);

    }


    renderer.render(scene, camera);

}

animate();


/* ==========================
   RESIZE
========================== */

window.addEventListener("resize", function() {

    renderer.setSize(180, 350, false);

});

</script>

</body>
</html>
