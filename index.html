
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Human Character</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #11131c;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#scene {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

#character {
    position: absolute;
    width: 180px;
    height: 350px;
    bottom: 0;
    left: 0;
    will-change: transform;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#status {
    position: absolute;
    top: 20px;
    left: 15px;
    color: white;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="scene">

    <div id="status">Loading 3D character...</div>

    <div id="character">
        <canvas id="human"></canvas>
    </div>

</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';


const canvas = document.getElementById("human");
const characterBox = document.getElementById("character");
const status = document.getElementById("status");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    35, 180 / 350, 0.1, 100
);

camera.position.set(0, 1.1, 4);
camera.lookAt(0, 0.9, 0);

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setSize(180, 350);

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;


// Lighting

scene.add(
    new THREE.HemisphereLight(
        0xffffff, 0x555566, 2
    )
);

const light = new THREE.DirectionalLight(
    0xffffff, 3
);

light.position.set(2, 4, 5);
scene.add(light);


// Load local GLB model

const loader = new GLTFLoader();

let human = null;
let mixer = null;

loader.load(

    './man.glb',

    function(gltf) {

        human = gltf.scene;

        scene.add(human);

        const box = new THREE.Box3()
            .setFromObject(human);

        const size = box.getSize(
            new THREE.Vector3()
        );

        const scale = 1.7 / size.y;

        human.scale.setScalar(scale);

        human.position.y = -box.min.y * scale;

        // Load available model animations

        if (gltf.animations.length > 0) {

            mixer = new THREE.AnimationMixer(human);

            const clip = gltf.animations.find(
                animation => /walk|run/i.test(animation.name)
            );

            if (clip) {
                mixer.clipAction(clip).play();
            }

        }

        status.textContent = "3D Character Loaded!";

    },

    function(progress) {

        if (progress.total > 0) {
            status.textContent =
                "Loading: " +
                Math.round(
                    progress.loaded / progress.total * 100
                ) + "%";
        }

    },

    function(error) {

        console.error(error);

        status.textContent =
            "Unable to load man.glb. Check file location.";

    }

);


// Movement

let position = -180;
let direction = 1;
let lastTime = 0;

const speed = 100;

function animate(time) {

    requestAnimationFrame(animate);

    const delta = lastTime
        ? Math.min((time - lastTime) / 1000, 0.05)
        : 0;

    lastTime = time;

    const screenWidth = window.innerWidth;
    const characterWidth = characterBox.offsetWidth;

    position += direction * speed * delta;

    if (position >= screenWidth - characterWidth) {
        position = screenWidth - characterWidth;
        direction = -1;
    }

    if (position <= 0) {
        position = 0;
        direction = 1;
    }

    characterBox.style.transform =
        `translateX(${position}px) scaleX(${direction < 0 ? -1 : 1})`;

    if (mixer) {
        mixer.update(delta);
    }

    renderer.render(scene, camera);

}

animate(0);


// Resize

window.addEventListener("resize", () => {

    renderer.setSize(
        canvas.clientWidth,
        canvas.clientHeight,
        false
    );

});

</script>

</body>
</html>
