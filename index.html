
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rope Pull Animation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

/* WEBSITE BELOW ANIMATION */
#website {
    position: relative;
    z-index: 1;
    min-height: 100vh;
}

/* ANIMATION OVERLAY */
#scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
    overflow: hidden;
    pointer-events: none;
    background: transparent;
}

/* RESPONSIVE CHARACTER */
#character {
    position: absolute;
    bottom: 0;
    left: 0;
    width: min(180px, 42vw);
    height: min(350px, 65vh);
    transform: translateX(-100%);
    z-index: 5;
    will-change: transform;
}

#threeCanvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* ROPE */
#rope {
    position: absolute;
    right: 8%;
    top: 0;
    width: 5px;
    height: 48%;
    background: linear-gradient(
        to right,
        #75451f,
        #d6a15c,
        #75451f
    );
    border-radius: 5px;
    transform-origin: top center;
    z-index: 4;
}

#rope::after {
    content: "";
    position: absolute;
    bottom: -12px;
    left: -5px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #b77b3c;
}

/* CURTAINS */
.curtain {
    position: absolute;
    top: 0;
    width: 51%;
    height: 100%;
    z-index: 10;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(0,0,0,0.12) 0px,
            rgba(255,255,255,0.05) 18px,
            rgba(0,0,0,0.18) 36px
        ),
        linear-gradient(
            90deg,
            #4b0715,
            #9c1732,
            #650b20
        );

    transition: transform 2s cubic-bezier(.7,0,.2,1);
}

#leftCurtain {
    left: 0;
    transform: translateX(0);
    border-right: 3px solid rgba(255,255,255,.15);
}

#rightCurtain {
    right: 0;
    transform: translateX(0);
    border-left: 3px solid rgba(255,255,255,.15);
}

#scene.open #leftCurtain {
    transform: translateX(-105%);
}

#scene.open #rightCurtain {
    transform: translateX(105%);
}

/* ROPE PULL ANIMATION */
@keyframes ropePull {
    0% {
        transform: rotate(0deg) translateY(0);
    }
    30% {
        transform: rotate(-13deg) translateY(25px);
    }
    60% {
        transform: rotate(0deg) translateY(0);
    }
    100% {
        transform: rotate(-13deg) translateY(25px);
    }
}

.pull-one {
    animation: ropePull 0.8s ease-in-out;
}

.pull-two {
    animation: ropePull 0.8s ease-in-out;
}

/* JUMP ANIMATION */
@keyframes jump {
    0% {
        transform: translateY(0);
    }
    35% {
        transform: translateY(-100px);
    }
    65% {
        transform: translateY(-100px);
    }
    100% {
        transform: translateY(0);
    }
}

.jumping {
    animation: jump 1.1s ease-in-out forwards;
}

/* SMALL MOBILE SCREENS */
@media (max-width: 480px) {
    #character {
        width: 38vw;
        height: 55vh;
    }

    #rope {
        right: 9%;
    }
}
</style>
</head>

<body>

<!-- YOUR WEBSITE CONTENT -->
<div id="website">
    <!-- Put your existing website HTML here -->
</div>

<!-- ANIMATION -->
<div id="scene">

    <div id="rope"></div>

    <div id="character">
        <canvas id="threeCanvas"></canvas>
    </div>

    <div class="curtain" id="leftCurtain"></div>
    <div class="curtain" id="rightCurtain"></div>

</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from "three";

import {
    GLTFLoader
} from "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";

/* ELEMENTS */
const character = document.getElementById("character");
const rope = document.getElementById("rope");
const scene = document.getElementById("scene");
const canvas = document.getElementById("threeCanvas");

/* THREE.JS SETUP */
const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    character.clientWidth,
    character.clientHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

const threeScene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    35,
    character.clientWidth / character.clientHeight,
    0.1,
    100
);

camera.position.set(0, 1.5, 5);

const ambientLight = new THREE.HemisphereLight(
    0xffffff,
    0x555555,
    2
);

threeScene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    3
);

directionalLight.position.set(2, 5, 5);
threeScene.add(directionalLight);

/* MODEL VARIABLES */
let human = null;
let mixer = null;
let walkAction = null;
let walking = false;

const clock = new THREE.Clock();

/* LOAD GLB MODEL */
const loader = new GLTFLoader();

loader.load(
    "./man.glb",

    function(gltf) {

        human = gltf.scene;

        human.scale.set(1, 1, 1);
        human.position.set(0, -1.5, 0);

        threeScene.add(human);

        mixer = new THREE.AnimationMixer(human);

        const walkClip = THREE.AnimationClip.findByName(
            gltf.animations,
            "walk"
        );

        const runClip = THREE.AnimationClip.findByName(
            gltf.animations,
            "run"
        );

        if (walkClip) {
            walkAction = mixer.clipAction(walkClip);
            walkAction.play();
            walkAction.paused = true;
        } else if (runClip) {
            walkAction = mixer.clipAction(runClip);
            walkAction.play();
            walkAction.paused = true;
        }

        startSequence();
    },

    undefined,

    function(error) {
        console.error("Model loading error:", error);
    }
);

/* WALKING */
function startWalking() {

    if (walkAction && !walking) {

        walking = true;

        walkAction.reset();
        walkAction.paused = false;
        walkAction.fadeIn(0.2);
    }
}

function stopWalking() {

    if (walkAction && walking) {

        walking = false;

        walkAction.fadeOut(0.2);
    }
}

/* RENDER LOOP */
function animate() {

    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    if (mixer) {
        mixer.update(delta);
    }

    renderer.render(threeScene, camera);
}

animate();

/* WAIT FUNCTION */
function wait(ms) {

    return new Promise(resolve => {
        setTimeout(resolve, ms);
    });
}

/* RESPONSIVE MOVEMENT */
function moveCharacter(from, to, duration) {

    return new Promise(resolve => {

        const start = performance.now();

        function update(now) {

            const progress = Math.min(
                (now - start) / duration,
                1
            );

            const x = from + (to - from) * progress;

            character.style.transform =
                `translateX(${x}px)`;

            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                resolve();
            }
        }

        requestAnimationFrame(update);
    });
}

/* JUMP */
async function jumpCharacter() {

    character.classList.add("jumping");

    await wait(1100);

    character.classList.remove("jumping");
}

/* PULL ROPE TWO TIMES */
async function pullRope() {

    for (let i = 0; i < 2; i++) {

        rope.classList.remove(
            "pull-one",
            "pull-two"
        );

        void rope.offsetWidth;

        rope.classList.add(
            i === 0 ? "pull-one" : "pull-two"
        );

        await wait(850);
    }

    rope.classList.remove(
        "pull-one",
        "pull-two"
    );
}

/* MAIN ANIMATION */
async function startSequence() {

    await wait(500);

    const width = window.innerWidth;

    const characterWidth =
        character.getBoundingClientRect().width;

    /* 1. START OUTSIDE LEFT */
    const startX = -characterWidth;

    /* 2. WALK TO MIDDLE */
    const middleX = width * 0.30;

    startWalking();

    await moveCharacter(
        startX,
        middleX,
        2500
    );

    stopWalking();

    await wait(300);

    /* 3. TURN TOWARDS ROPE */
    if (human) {
        human.rotation.y = Math.PI / 2;
    }

    await wait(300);

    /* 4. WALK TOWARDS RIGHT */
    const ropeX = Math.max(
        0,
        Math.min(
            width - characterWidth,
            width * 0.88 - characterWidth
        )
    );

    startWalking();

    await moveCharacter(
        middleX,
        ropeX,
        1800
    );

    stopWalking();

    await wait(250);

    /* 5. JUMP */
    await jumpCharacter();

    await wait(200);

    /* 6. PULL ROPE TWICE */
    await pullRope();

    await wait(400);

    /* 7. OPEN CURTAINS */
    scene.classList.add("open");

    await wait(2300);

    /* 8. REMOVE ANIMATION */
    scene.style.display = "none";
}

/* RESIZE SUPPORT */
window.addEventListener("resize", () => {

    const width = character.clientWidth;
    const height = character.clientHeight;

    renderer.setSize(width, height);

    camera.aspect = width / height;
    camera.updateProjectionMatrix();
});

</script>

</body>
</html>
