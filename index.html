
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Curtain Reveal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

#scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 9999;
}

/* CHARACTER */

#character {
    position: absolute;
    width: 180px;
    height: 350px;
    bottom: 0;
    left: 0;
    z-index: 5;
    will-change: transform;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* CURTAINS */

.curtain {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 51%;
    z-index: 2;
    background:
        repeating-linear-gradient(
            90deg,
            #650d27 0px,
            #a51d43 20px,
            #710f2c 40px,
            #bd3155 55px,
            #650d27 75px
        );
    box-shadow: 0 0 35px #0009;
    transition: transform 2s cubic-bezier(.7,0,.2,1);
}

#leftCurtain {
    left: 0;
    border-right: 5px solid #d6a64b;
}

#rightCurtain {
    right: 0;
    border-left: 5px solid #d6a64b;
}

#scene.open #leftCurtain {
    transform: translateX(-105%);
}

#scene.open #rightCurtain {
    transform: translateX(105%);
}

/* CURTAIN TOP */

#topBar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 16px;
    background: linear-gradient(
        #f5d78a,
        #a67b30,
        #f5d78a
    );
    z-index: 4;
}

/* ROPE */

#rope {
    position: absolute;
    right: 8%;
    top: 0;
    width: 12px;
    height: 58%;
    z-index: 6;
    transform-origin: top;
}

#ropeLine {
    position: absolute;
    top: 0;
    left: 5px;
    width: 3px;
    height: 100%;
    background: linear-gradient(
        90deg,
        #8c582b,
        #f1d19b,
        #80502b
    );
    border-radius: 5px;
}

#ropeHandle {
    position: absolute;
    bottom: 0;
    left: -5px;
    width: 22px;
    height: 32px;
    border: 3px solid #d5ad6c;
    border-radius: 50%;
    background: #8b572c;
}

/* ROPE PULL */

#rope.pulled {
    animation: ropePull 0.8s ease-in-out forwards;
}

@keyframes ropePull {
    0% {
        transform: translateY(0);
    }

    35% {
        transform: translateY(90px);
    }

    65% {
        transform: translateY(65px);
    }

    100% {
        transform: translateY(100px);
    }
}

/* STATUS */

#status {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 10px 15px;
    background: #171727dd;
    color: white;
    font-size: 12px;
    border-radius: 10px;
    z-index: 10;
}

/* REMOVE STATUS WHEN DONE */

#scene.finished #status {
    display: none;
}

</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
}
</script>

</head>

<body>

<div id="scene">

    <div id="status">Loading character...</div>

    <div id="topBar"></div>

    <div id="leftCurtain" class="curtain"></div>

    <div id="rightCurtain" class="curtain"></div>

    <div id="rope">
        <div id="ropeLine"></div>
        <div id="ropeHandle"></div>
    </div>

    <div id="character">
        <canvas id="human"></canvas>
    </div>

</div>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";


/* ===============================
   ELEMENTS
================================ */

const canvas = document.getElementById("human");

const character = document.getElementById("character");

const sceneElement = document.getElementById("scene");

const status = document.getElementById("status");

const rope = document.getElementById("rope");


/* ===============================
   THREE JS SCENE
================================ */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    35,
    180 / 350,
    0.1,
    100
);

camera.position.set(0, 1.1, 4);

camera.lookAt(0, 0.9, 0);


/* ===============================
   RENDERER
================================ */

const renderer = new THREE.WebGLRenderer({
    canvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.setSize(180, 350, false);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.2;


/* ===============================
   LIGHTS
================================ */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x555566,
        2
    )
);

const light = new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(2, 4, 5);

scene.add(light);


/* ===============================
   VARIABLES
================================ */

let human = null;

let mixer = null;

let walkAction = null;

let runAction = null;

let walking = false;

let phase = "loading";

let phaseStart = 0;

let elapsed = 0;

const clock = new THREE.Clock();


/* ===============================
   HELPER FUNCTIONS
================================ */

function smooth(t) {

    return t * t * (3 - 2 * t);

}

function lerp(a, b, t) {

    return a + (b - a) * t;

}

function setPhase(name) {

    phase = name;

    phaseStart = elapsed;

}

function moveCharacter(x, y = 0) {

    character.style.transform =
        `translate(${x}px, ${-y}px)`;

}


/* ===============================
   WALK ANIMATION
================================ */

function startWalking() {

    if (!walkAction || walking) return;

    walkAction.reset();

    walkAction.setEffectiveTimeScale(1);

    walkAction.setEffectiveWeight(1);

    walkAction.fadeIn(0.3);

    walkAction.play();

    walking = true;

}

function stopWalking() {

    if (!walkAction || !walking) return;

    walkAction.fadeOut(0.3);

    walking = false;

}


/* ===============================
   LOAD CHARACTER
================================ */

const loader = new GLTFLoader();

loader.load(

    "./man.glb",

    function(gltf) {

        human = gltf.scene;

        scene.add(human);


        // Model sizing

        const box = new THREE.Box3()
            .setFromObject(human);

        const size = box.getSize(
            new THREE.Vector3()
        );

        const scale = 1.7 / size.y;

        human.scale.setScalar(scale);

        human.position.y = -box.min.y * scale;


        // Animation setup

        mixer = new THREE.AnimationMixer(human);

        const walkClip = gltf.animations.find(
            clip => /walk/i.test(clip.name)
        );

        const runClip = gltf.animations.find(
            clip => /run/i.test(clip.name)
        );


        if (walkClip) {

            walkAction = mixer.clipAction(walkClip);

            walkAction.setLoop(THREE.LoopRepeat);

        }

        if (runClip) {

            runAction = mixer.clipAction(runClip);

            runAction.setLoop(THREE.LoopRepeat);

        }


        status.textContent =
            "Character ready!";

        setPhase("enter");

    },

    function(progress) {

        if (progress.total > 0) {

            status.textContent =
                "Loading " +
                Math.round(
                    progress.loaded / progress.total * 100
                ) + "%";

        }

    },

    function(error) {

        console.error(error);

        status.textContent =
            "Could not load man.glb";

    }

);


/* ===============================
   MAIN ANIMATION
================================ */

function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(
        clock.getDelta(),
        0.05
    );

    elapsed += delta;

    if (mixer) {

        mixer.update(delta);

    }

    if (!human) {

        renderer.render(scene, camera);

        return;

    }


    const width = window.innerWidth;

    const center = (width - 180) / 2;

    const ropePosition = width * 0.88 - 180;


    /* ===========================
       1. WALK FROM LEFT
    ============================ */

    if (phase === "enter") {

        const duration = 4;

        const t = Math.min(
            (elapsed - phaseStart) / duration,
            1
        );

        moveCharacter(
            lerp(-200, center, smooth(t))
        );

        human.rotation.y = Math.PI / 2;

        startWalking();

        if (t >= 1) {

            stopWalking();

            setPhase("turn");

        }

    }


    /* ===========================
       2. TURN TOWARDS ROPE
    ============================ */

    else if (phase === "turn") {

        const t = Math.min(
            (elapsed - phaseStart) / 0.7,
            1
        );

        moveCharacter(center);

        human.rotation.y = lerp(
            Math.PI / 2,
            0,
            smooth(t)
        );

        if (t >= 1) {

            setPhase("moveRight");

        }

    }


    /* ===========================
       3. WALK TO RIGHT SIDE
    ============================ */

    else if (phase === "moveRight") {

        const t = Math.min(
            (elapsed - phaseStart) / 2.5,
            1
        );

        moveCharacter(
            lerp(center, ropePosition, smooth(t))
        );

        human.rotation.y = Math.PI / 2;

        startWalking();

        if (t >= 1) {

            stopWalking();

            setPhase("jump");

        }

    }


    /* ===========================
       4. JUMP TO ROPE
    ============================ */

    else if (phase === "jump") {

        const duration = 1;

        const t = Math.min(
            (elapsed - phaseStart) / duration,
            1
        );

        const jumpHeight =
            Math.sin(t * Math.PI) * 90;

        moveCharacter(ropePosition, jumpHeight);

        human.rotation.y = Math.PI / 2;

        if (t >= 1) {

            setPhase("pull");

        }

    }


    /* ===========================
       5. PULL ROPE
    ============================ */

    else if (phase === "pull") {

        moveCharacter(ropePosition);

        human.rotation.y = Math.PI / 2;

        if (elapsed - phaseStart < 0.1) {

            rope.classList.add("pulled");

        }

        if (elapsed - phaseStart >= 1.1) {

            setPhase("open");

        }

    }


    /* ===========================
       6. OPEN CURTAINS
    ============================ */

    else if (phase === "open") {

        moveCharacter(ropePosition);

        sceneElement.classList.add("open");

        if (elapsed - phaseStart >= 2.2) {

            setPhase("finish");

        }

    }


    /* ===========================
       7. FINISH
    ============================ */

    else if (phase === "finish") {

        moveCharacter(ropePosition);

        sceneElement.classList.add("finished");

        // Character remains at the right side.

    }


    renderer.render(scene, camera);

}


/* ===============================
   START
================================ */

animate();


/* ===============================
   RESIZE
================================ */

window.addEventListener("resize", () => {

    renderer.setSize(180, 350, false);

});

</script>

</body>
</html>
