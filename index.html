
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rope Pull Animation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

/* YOUR WEBSITE CONTENT IS UNDER THE ANIMATION */
#website {
    position: relative;
    z-index: 1;
    min-height: 100vh;
}

/* ANIMATION SCREEN */
#scene {
    position: fixed;
    inset: 0;
    z-index: 9999;
    overflow: hidden;
    pointer-events: none;
    background: transparent;
}

/* CHARACTER */
#character {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 180px;
    height: 350px;
    transform: translateX(-220px);
    z-index: 5;
    will-change: transform;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* ROPE */
#rope {
    position: absolute;
    right: 8%;
    top: 0;
    width: 5px;
    height: 48%;
    background: linear-gradient(
        to right,
        #75451f,
        #d6a15c,
        #75451f
    );
    border-radius: 5px;
    transform-origin: top center;
    z-index: 4;
}

#rope::after {
    content: "";
    position: absolute;
    bottom: -12px;
    left: -5px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #b77b3c;
}

/* CURTAINS */
.curtain {
    position: absolute;
    top: 0;
    width: 51%;
    height: 100%;
    z-index: 10;
    background:
        repeating-linear-gradient(
            90deg,
            rgba(0,0,0,0.12) 0px,
            rgba(255,255,255,0.05) 18px,
            rgba(0,0,0,0.18) 36px
        ),
        linear-gradient(
            90deg,
            #4b0715,
            #9c1732,
            #650b20
        );
    transition: transform 2s cubic-bezier(.7,0,.2,1);
}

#leftCurtain {
    left: 0;
    transform: translateX(0);
    border-right: 3px solid rgba(255,255,255,.15);
}

#rightCurtain {
    right: 0;
    transform: translateX(0);
    border-left: 3px solid rgba(255,255,255,.15);
}

#scene.open #leftCurtain {
    transform: translateX(-105%);
}

#scene.open #rightCurtain {
    transform: translateX(105%);
}

/* ROPE PULL MOVEMENT */
@keyframes ropePull {
    0%   { transform: rotate(0deg) translateY(0); }
    30%  { transform: rotate(-13deg) translateY(25px); }
    60%  { transform: rotate(0deg) translateY(0); }
    100% { transform: rotate(-13deg) translateY(25px); }
}

.pull-one {
    animation: ropePull 0.8s ease-in-out;
}

.pull-two {
    animation: ropePull 0.8s ease-in-out;
}

/* JUMP */
@keyframes jump {
    0%   { transform: translateY(0); }
    35%  { transform: translateY(-125px); }
    65%  { transform: translateY(-125px); }
    100% { transform: translateY(0); }
}

.jumping {
    animation: jump 1.1s ease-in-out forwards;
}
</style>
</head>

<body>

<!-- PUT YOUR WEBSITE CONTENT HERE -->
<div id="website">
    <!-- Your existing website content goes here -->
</div>

<!-- ANIMATION OVERLAY -->
<div id="scene">

    <div id="rope"></div>

    <div id="character">
        <canvas id="threeCanvas"></canvas>
    </div>

    <div class="curtain" id="leftCurtain"></div>
    <div class="curtain" id="rightCurtain"></div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";

/* ELEMENTS */
const character = document.getElementById("character");
const rope = document.getElementById("rope");
const scene = document.getElementById("scene");
const canvas = document.getElementById("threeCanvas");

/* THREE SETUP */
const renderer = new THREE.WebGLRenderer({
    canvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(180, 350);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const threeScene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    35,
    180 / 350,
    0.1,
    100
);

camera.position.set(0, 1.5, 5);

threeScene.add(
    new THREE.HemisphereLight(0xffffff, 0x555555, 2)
);

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(2, 5, 5);
threeScene.add(light);

let human = null;
let mixer = null;
let walkAction = null;
let idleAction = null;
let walking = false;

const clock = new THREE.Clock();

/* LOAD MODEL */
const loader = new GLTFLoader();

loader.load(
    "./man.glb",

    (gltf) => {
        human = gltf.scene;

        human.scale.set(1, 1, 1);
        human.position.set(0, -1.5, 0);

        threeScene.add(human);

        mixer = new THREE.AnimationMixer(human);

        const walkClip = THREE.AnimationClip.findByName(
            gltf.animations,
            "walk"
        );

        const runClip = THREE.AnimationClip.findByName(
            gltf.animations,
            "run"
        );

        if (walkClip) {
            walkAction = mixer.clipAction(walkClip);
            walkAction.play();
            walkAction.paused = true;
        } else if (runClip) {
            walkAction = mixer.clipAction(runClip);
            walkAction.play();
            walkAction.paused = true;
        }

        startSequence();
    },

    undefined,

    (error) => {
        console.error("Model loading error:", error);
    }
);

/* WALK CONTROL */
function startWalking() {
    if (walkAction && !walking) {
        walking = true;
        walkAction.reset();
        walkAction.paused = false;
        walkAction.fadeIn(0.2);
    }
}

function stopWalking() {
    if (walkAction && walking) {
        walking = false;
        walkAction.fadeOut(0.2);
    }
}

/* ANIMATION LOOP */
function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    if (mixer) {
        mixer.update(delta);
    }

    renderer.render(threeScene, camera);
}

animate();

/* WAIT */
function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

/* CHARACTER MOVEMENT */
function moveCharacter(from, to, duration) {
    return new Promise(resolve => {
        const start = performance.now();

        function update(now) {
            const progress = Math.min(
                (now - start) / duration,
                1
            );

            const x = from + (to - from) * progress;

            character.style.transform =
                `translateX(${x}px)`;

            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                resolve();
            }
        }

        requestAnimationFrame(update);
    });
}

/* JUMP */
async function jumpCharacter() {
    character.classList.add("jumping");
    await wait(1100);
    character.classList.remove("jumping");
}

/* ROPE PULL */
async function pullRope(times) {
    for (let i = 0; i < times; i++) {

        rope.classList.remove("pull-one", "pull-two");

        void rope.offsetWidth;

        rope.classList.add(
            i === 0 ? "pull-one" : "pull-two"
        );

        await wait(850);
    }

    rope.classList.remove("pull-one", "pull-two");
}

/* MAIN SEQUENCE */
async function startSequence() {

    await wait(500);

    const width = window.innerWidth;

    /* 1. WALK FROM LEFT TO MIDDLE */
    startWalking();

    await moveCharacter(-220, width * 0.35, 2500);

    stopWalking();

    await wait(300);

    /* 2. TURN TOWARDS ROPE */
    if (human) {
        human.rotation.y = Math.PI / 2;
    }

    await wait(300);

    /* 3. WALK TOWARDS RIGHT SIDE */
    startWalking();

    const ropePosition = width * 0.88 - 180;

    await moveCharacter(
        width * 0.35,
        ropePosition,
        1800
    );

    stopWalking();

    await wait(250);

    /* 4. JUMP TO REACH ROPE */
    await jumpCharacter();

    await wait(200);

    /* 5. HOLD AND PULL ROPE TWO TIMES */
    await pullRope(2);

    await wait(400);

    /* 6. OPEN CURTAINS */
    scene.classList.add("open");

    await wait(2300);

    /* 7. REMOVE ANIMATION OVERLAY */
    scene.style.display = "none";
}

/* RESPONSIVE */
window.addEventListener("resize", () => {
    renderer.setSize(180, 350);
});
</script>

</body>
</html>
