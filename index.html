
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Human - Skeleton Detector</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #11131c;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#scene {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

#character {
    position: absolute;
    width: 180px;
    height: 350px;
    bottom: 0;
    left: 0;
    will-change: transform;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#status {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    max-height: 43vh;
    overflow-y: auto;
    z-index: 10;
    padding: 14px;
    background: #252b3b;
    color: white;
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

#status strong {
    color: #8ce5bd;
}

#character-label {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #aaa;
    font-size: 11px;
    pointer-events: none;
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
}
</script>

</head>

<body>

<div id="scene">

    <div id="status">
        Loading 3D human...
    </div>

    <div id="character">
        <canvas id="human"></canvas>
    </div>

    <div id="character-label">
        3D HUMAN MODEL
    </div>

</div>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";


/* ==========================
   ELEMENTS
========================== */

const canvas = document.getElementById("human");

const characterBox = document.getElementById("character");

const status = document.getElementById("status");


/* ==========================
   SCENE
========================== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    35,
    180 / 350,
    0.1,
    100
);

camera.position.set(0, 1.1, 4);

camera.lookAt(0, 0.9, 0);


/* ==========================
   RENDERER
========================== */

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.setSize(180, 350, false);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.2;


/* ==========================
   LIGHTING
========================== */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x555566,
        2
    )
);

const mainLight = new THREE.DirectionalLight(
    0xffffff,
    3
);

mainLight.position.set(2, 4, 5);

scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(
    0x9ebaff,
    1
);

fillLight.position.set(-3, 2, -2);

scene.add(fillLight);


/* ==========================
   VARIABLES
========================== */

let human = null;

let mixer = null;

let bones = [];

let clips = [];

const clock = new THREE.Clock();


/* ==========================
   LOAD MODEL
========================== */

const loader = new GLTFLoader();

status.textContent = "Loading man.glb...";

loader.load(

    "./man.glb",

    function(gltf) {

        human = gltf.scene;

        scene.add(human);


        /* MODEL SIZE */

        const box = new THREE.Box3()
            .setFromObject(human);

        const size = box.getSize(
            new THREE.Vector3()
        );

        if (size.y > 0) {

            const scale = 1.7 / size.y;

            human.scale.setScalar(scale);

            human.position.y = -box.min.y * scale;

        }


        /* DETECT BONES */

        bones = [];

        human.traverse(function(object) {

            if (object.isBone) {

                bones.push(object.name);

            }

        });


        /* DETECT ANIMATIONS */

        clips = gltf.animations;

        let report = "";

        report += "3D HUMAN LOADED SUCCESSFULLY!\n\n";

        report += "ANIMATION CHECK\n";

        report += "Total animations: " +
            clips.length + "\n";

        if (clips.length > 0) {

            report += "Animation names:\n";

            clips.forEach(function(clip, index) {

                report +=
                    (index + 1) + ". " +
                    clip.name + "\n";

            });

            mixer = new THREE.AnimationMixer(human);

        } else {

            report += "No animations found.\n";

        }


        /* BONE CHECK */

        report += "\n--------------------\n";

        report += "SKELETON CHECK\n";

        report += "Total bones: " +
            bones.length + "\n\n";

        if (bones.length > 0) {

            report += "BONE NAMES:\n";

            bones.forEach(function(name, index) {

                report +=
                    (index + 1) + ". " +
                    name + "\n";

            });

        } else {

            report +=
                "No bones detected in this model.\n";

        }


        /* SHOW RESULT ON SCREEN */

        status.textContent = report;

        console.log("Detected bones:", bones);

        console.log("Animations:", clips);

    },

    function(progress) {

        if (progress.total > 0) {

            const percent = Math.round(
                progress.loaded / progress.total * 100
            );

            status.textContent =
                "Loading 3D human: " +
                percent + "%";

        } else {

            status.textContent =
                "Downloading 3D human...";

        }

    },

    function(error) {

        console.error(error);

        status.textContent =
            "MODEL LOADING FAILED!\n\n" +
            "Check that man.glb exists in the repository root.";

    }

);


/* ==========================
   MOVEMENT
========================== */

let position = -180;

let direction = 1;

const speed = 100;


/* ==========================
   ANIMATION LOOP
========================== */

function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(
        clock.getDelta(),
        0.05
    );

    const screenWidth = window.innerWidth;

    const characterWidth =
        characterBox.offsetWidth;

    position += direction * speed * delta;


    // RIGHT SIDE

    if (position >= screenWidth - characterWidth) {

        position = screenWidth - characterWidth;

        direction = -1;

    }


    // LEFT SIDE

    if (position <= 0) {

        position = 0;

        direction = 1;

    }


    // MOVE CHARACTER

    characterBox.style.transform =
        `translateX(${position}px) scaleX(${direction < 0 ? -1 : 1})`;


    // UPDATE MODEL ANIMATION

    if (mixer) {

        mixer.update(delta);

    }

    renderer.render(scene, camera);

}

animate();


/* ==========================
   RESIZE
========================== */

window.addEventListener("resize", function() {

    renderer.setSize(180, 350, false);

});

</script>

</body>
</html>
