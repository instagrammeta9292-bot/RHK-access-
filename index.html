
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Human Experience</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #11131c;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#scene {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
}

#character {
    position: absolute;
    width: 180px;
    height: 350px;
    bottom: 0;
    left: 0;
    will-change: transform;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#message {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translate(-50%, 15px);
    background: #fff;
    color: #292338;
    padding: 15px 22px;
    border-radius: 18px;
    font-size: 17px;
    font-weight: bold;
    text-align: center;
    width: max-content;
    max-width: 88%;
    opacity: 0;
    transition: 0.6s;
    z-index: 5;
    box-shadow: 0 8px 30px #0005;
}

#message.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

#status {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    background: #252b3b;
    color: white;
    padding: 12px;
    border-radius: 12px;
    font-size: 12px;
    z-index: 10;
}

</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
}
</script>

</head>

<body>

<div id="scene">

    <div id="status">Loading 3D human...</div>

    <div id="message"></div>

    <div id="character">
        <canvas id="human"></canvas>
    </div>

</div>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";


/* =====================================
   ELEMENTS
===================================== */

const canvas = document.getElementById("human");

const characterBox = document.getElementById("character");

const status = document.getElementById("status");

const message = document.getElementById("message");


/* =====================================
   SCENE
===================================== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    35,
    180 / 350,
    0.1,
    100
);

camera.position.set(0, 1.1, 4);

camera.lookAt(0, 0.9, 0);


/* =====================================
   RENDERER
===================================== */

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.setSize(180, 350, false);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.2;


/* =====================================
   LIGHTING
===================================== */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x555566,
        2
    )
);

const mainLight = new THREE.DirectionalLight(
    0xffffff,
    3
);

mainLight.position.set(2, 4, 5);

scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(
    0x9ebaff,
    1
);

fillLight.position.set(-3, 2, -2);

scene.add(fillLight);


/* =====================================
   VARIABLES
===================================== */

let human = null;

let mixer = null;

let walkAction = null;

let isWalking = false;

let bones = {};

let baseRotations = {};

let kneelBones = [];

let baseY = 0;

let phase = "loading";

let phaseStart = 0;

let currentTime = 0;

const clock = new THREE.Clock();


/* =====================================
   HELPER FUNCTIONS
===================================== */

function smooth(t) {

    return t * t * (3 - 2 * t);

}

function lerp(a, b, t) {

    return a + (b - a) * t;

}

function normalize(name) {

    return name.toLowerCase().replace(
        /[^a-z0-9]/g,
        ""
    );

}

function findBone(names) {

    for (const name of names) {

        const result = bones[normalize(name)];

        if (result) return result;

    }

    return null;

}

function setPhase(name) {

    phase = name;

    phaseStart = currentTime;

}

function showMessage(text) {

    message.textContent = text;

    message.classList.add("show");

}

function hideMessage() {

    message.classList.remove("show");

}


/* =====================================
   FLOWER MODEL
===================================== */

const flower = new THREE.Group();

const flowerStemMaterial =
new THREE.MeshStandardMaterial({
    color: 0x258b48,
    roughness: 0.8
});

const petalMaterial =
new THREE.MeshStandardMaterial({
    color: 0xff73a6,
    roughness: 0.45
});

const centerMaterial =
new THREE.MeshStandardMaterial({
    color: 0xffd65c
});

const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(
        0.018, 0.025, 0.65, 8
    ),
    flowerStemMaterial
);

stem.position.y = -0.15;

flower.add(stem);


// Flower centre

const centre = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 16, 16),
    centerMaterial
);

centre.position.y = 0.25;

flower.add(centre);


// Six flower petals

for (let i = 0; i < 6; i++) {

    const angle = i * Math.PI / 3;

    const petal = new THREE.Mesh(
        new THREE.SphereGeometry(
            0.105, 16, 16
        ),
        petalMaterial
    );

    petal.position.set(
        Math.cos(angle) * 0.13,
        0.27,
        Math.sin(angle) * 0.13
    );

    petal.scale.set(1, 0.65, 1);

    flower.add(petal);

}


// Flower leaf

const leaf = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 12, 12),
    flowerStemMaterial
);

leaf.position.set(0.09, -0.12, 0);

leaf.scale.set(1.5, 0.45, 0.6);

flower.add(leaf);


// Initially hidden

flower.visible = false;

flower.scale.setScalar(0.45);

flower.position.set(0.42, 0.8, 0.3);

scene.add(flower);


/* =====================================
   WALKING CONTROLS
===================================== */

function startWalking() {

    if (!walkAction) return;

    if (isWalking) return;

    walkAction.reset();

    walkAction.enabled = true;

    walkAction.setEffectiveTimeScale(1);

    walkAction.setEffectiveWeight(1);

    walkAction.setLoop(THREE.LoopRepeat);

    walkAction.fadeIn(0.3);

    walkAction.play();

    isWalking = true;

}

function stopWalking() {

    if (!walkAction || !isWalking) return;

    walkAction.fadeOut(0.25);

    isWalking = false;

}


/* =====================================
   FIND KNEELING BONES
===================================== */

function setupKneelBones() {

    const leftUpper = findBone([
        "LeftUpLeg",
        "LeftUpperLeg",
        "thigh_l",
        "LeftThigh"
    ]);

    const rightUpper = findBone([
        "RightUpLeg",
        "RightUpperLeg",
        "thigh_r",
        "RightThigh"
    ]);

    const leftLower = findBone([
        "LeftLeg",
        "LeftLowerLeg",
        "calf_l",
        "LeftKnee"
    ]);

    const rightLower = findBone([
        "RightLeg",
        "RightLowerLeg",
        "calf_r",
        "RightKnee"
    ]);

    const hips = findBone([
        "Hips",
        "Pelvis"
    ]);

    const spine = findBone([
        "Spine",
        "Spine1"
    ]);

    kneelBones = [
        {
            bone: leftUpper,
            x: -0.85,
            z: 0
        },
        {
            bone: rightUpper,
            x: -0.85,
            z: 0
        },
        {
            bone: leftLower,
            x: 1.35,
            z: 0
        },
        {
            bone: rightLower,
            x: 1.35,
            z: 0
        },
        {
            bone: hips,
            x: -0.15,
            z: 0
        },
        {
            bone: spine,
            x: 0.12,
            z: 0
        }
    ].filter(item => item.bone);


    console.log(
        "Kneeling bones:",
        kneelBones.map(item => item.bone.name)
    );

}


/* =====================================
   KNEEL POSE
===================================== */

function applyKneel(progress) {

    const t = smooth(progress);

    for (const item of kneelBones) {

        const bone = item.bone;

        const base = baseRotations[
            normalize(bone.name)
        ];

        bone.rotation.x =
            base.x + item.x * t;

        bone.rotation.z =
            base.z + item.z * t;

    }

    // Lower character slightly

    human.position.y = baseY - 0.12 * t;

}


/* =====================================
   RESTORE STANDING POSE
===================================== */

function applyStand(progress) {

    const t = smooth(progress);

    for (const item of kneelBones) {

        const bone = item.bone;

        const base = baseRotations[
            normalize(bone.name)
        ];

        bone.rotation.x =
            base.x + item.x * (1 - t);

        bone.rotation.z =
            base.z + item.z * (1 - t);

    }

    human.position.y = lerp(
        baseY - 0.12,
        baseY,
        t
    );

}


/* =====================================
   LOAD HUMAN MODEL
===================================== */

const loader = new GLTFLoader();

loader.load(

    "./man.glb",

    function(gltf) {

        human = gltf.scene;

        scene.add(human);


        // Fit model

        const box = new THREE.Box3()
            .setFromObject(human);

        const size = box.getSize(
            new THREE.Vector3()
        );

        if (size.y > 0) {

            const scale = 1.7 / size.y;

            human.scale.setScalar(scale);

            human.position.y = -box.min.y * scale;

            baseY = human.position.y;

        }


        // Detect bones

        human.traverse(function(object) {

            if (object.isBone) {

                const key = normalize(object.name);

                bones[key] = object;

                baseRotations[key] = {
                    x: object.rotation.x,
                    y: object.rotation.y,
                    z: object.rotation.z
                };

            }

        });


        // Find kneeling bones

        setupKneelBones();


        // Load walk animation

        mixer = new THREE.AnimationMixer(human);

        const walkClip = gltf.animations.find(
            clip => /walk/i.test(clip.name)
        );

        if (walkClip) {

            walkAction = mixer.clipAction(walkClip);

            walkAction.setLoop(THREE.LoopRepeat);

        }


        status.textContent =
            "3D HUMAN READY | " +
            gltf.animations.length +
            " animations | " +
            Object.keys(bones).length +
            " bones";


        // Begin animation

        setPhase("enter");

    },


    function(progress) {

        if (progress.total > 0) {

            status.textContent =
                "Loading: " +
                Math.round(
                    progress.loaded /
                    progress.total * 100
                ) + "%";

        }

    },


    function(error) {

        console.error(error);

        status.textContent =
            "Unable to load man.glb";

    }

);


/* =====================================
   CHARACTER POSITION
===================================== */

function moveCharacter(x) {

    characterBox.style.transform =
        `translateX(${x}px)`;

}


/* =====================================
   MAIN SEQUENCE
===================================== */

function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(
        clock.getDelta(),
        0.05
    );

    currentTime += delta;


    // Update walk animation only once per frame

    if (mixer) {

        mixer.update(delta);

    }


    if (!human) {

        renderer.render(scene, camera);

        return;

    }


    const screenWidth = window.innerWidth;

    const center = (screenWidth - 180) / 2;


    /* =================================
       1. ENTER FROM LEFT
    ================================= */

    if (phase === "enter") {

        const t = Math.min(
            (currentTime - phaseStart) / 4,
            1
        );

        moveCharacter(
            lerp(-200, center, smooth(t))
        );

        // Face walking direction

        human.rotation.y = Math.PI / 2;

        flower.visible = false;

        startWalking();

        if (t >= 1) {

            stopWalking();

            setPhase("turn");

        }

    }


    /* =================================
       2. TURN TO FRONT
    ================================= */

    else if (phase === "turn") {

        const t = Math.min(
            (currentTime - phaseStart) / 0.9,
            1
        );

        moveCharacter(center);

        human.rotation.y = lerp(
            Math.PI / 2,
            0,
            smooth(t)
        );

        if (t >= 1) {

            setPhase("kneel");

        }

    }


    /* =================================
       3. KNEEL DOWN
    ================================= */

    else if (phase === "kneel") {

        const t = Math.min(
            (currentTime - phaseStart) / 1.5,
            1
        );

        moveCharacter(center);

        human.rotation.y = 0;

        applyKneel(t);

        if (t >= 1) {

            flower.visible = true;

            showMessage("A FLOWER FOR YOU ❤️");

            setPhase("present");

        }

    }


    /* =================================
       4. PRESENT FLOWER
    ================================= */

    else if (phase === "present") {

        moveCharacter(center);

        human.rotation.y = 0;

        // Gentle flower movement

        flower.position.y =
            0.8 + Math.sin(currentTime * 2) * 0.025;

        flower.rotation.z =
            Math.sin(currentTime * 1.5) * 0.06;

        if (currentTime - phaseStart >= 3.5) {

            hideMessage();

            setPhase("stand");

        }

    }


    /* =================================
       5. STAND UP
    ================================= */

    else if (phase === "stand") {

        const t = Math.min(
            (currentTime - phaseStart) / 1.5,
            1
        );

        moveCharacter(center);

        applyStand(t);

        flower.visible = false;

        if (t >= 1) {

            setPhase("exit");

        }

    }


    /* =================================
       6. WALK TO RIGHT
    ================================= */

    else if (phase === "exit") {

        const t = Math.min(
            (currentTime - phaseStart) / 4,
            1
        );

        moveCharacter(
            lerp(center, screenWidth + 200, smooth(t))
        );

        human.rotation.y = Math.PI / 2;

        startWalking();

        if (t >= 1) {

            stopWalking();

            human.visible = false;

            flower.visible = false;

            status.textContent =
                "Animation completed!";

            setPhase("finished");

        }

    }


    renderer.render(scene, camera);

}

animate();


/* =====================================
   RESIZE
===================================== */

window.addEventListener("resize", function() {

    renderer.setSize(180, 350, false);

});

</script>

</body>
</html>
